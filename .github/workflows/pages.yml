# Publishes the game to GitHub Pages on every push to master.
# Only the files the game needs are published; tests, tools and source audio stay out.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # TypeScript checks the plain .js files (nothing is compiled). --ignore-scripts skips
      # building the native canvas library, which only the local browser-flow tests need.
      - name: Type-check the game
        run: |
          npm ci --ignore-scripts
          npm run typecheck

      # The tests that need nothing installed. The browser-flow tests need a native canvas
      # library, so those are run locally with `npm test`.
      - name: Check the game logic, audio and sound files
        run: |
          node tests/highscores.mjs
          node tests/wolves.mjs
          node tests/archers.mjs
          node tests/mary.mjs
          node tests/frosty.mjs
          node tests/boleslaus.mjs
          node tests/nicholas.mjs
          node tests/sword.mjs
          node tests/mouseaim.mjs
          node tests/arrange.mjs
          node tests/tuning.mjs
          node tests/gamepad.mjs
          node tests/music.mjs
          node tests/audio.mjs
          node tests/sfx.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site/audio
          cp index.html CREDITS.md LICENSE _site/
          cp -r js _site/js
          cp -r audio/sfx _site/audio/sfx
          find _site -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, so the artifact is registered before the deploy step looks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
